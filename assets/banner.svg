<svg fill="none" viewBox="0 0 1200 480" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          background: linear-gradient(135deg, #070913 0%, #0d1326 50%, #070a14 100%);
          border-radius: 16px;
          border: 1px solid rgba(0, 208, 156, 0.25);
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 208, 156, 0.15);
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
          color: #ffffff;
          padding: 40px;
          box-sizing: border-box;
          height: 480px;
          position: relative;
          overflow: hidden;
        }

        /* Ambient Glow Grid */
        .grid-bg {
          position: absolute;
          top: 0; left: 0; right: 0; bottom: 0;
          background-image: 
            radial-gradient(circle at 80% 20%, rgba(0, 208, 156, 0.12) 0%, transparent 40%),
            radial-gradient(circle at 20% 80%, rgba(138, 43, 226, 0.15) 0%, transparent 45%),
            linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
          background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
          pointer-events: none;
        }

        .header-badge {
          display: inline-flex;
          align-items: center;
          background: rgba(0, 208, 156, 0.12);
          border: 1px solid rgba(0, 208, 156, 0.4);
          border-radius: 30px;
          padding: 6px 16px;
          font-size: 13px;
          font-weight: 600;
          color: #00D09C;
          letter-spacing: 0.5px;
          margin-bottom: 20px;
          box-shadow: 0 0 15px rgba(0, 208, 156, 0.2);
        }

        .pulse-dot {
          width: 8px;
          height: 8px;
          background-color: #00D09C;
          border-radius: 50%;
          margin-right: 10px;
          animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
          0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 208, 156, 0.7); }
          70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(0, 208, 156, 0); }
          100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 208, 156, 0); }
        }

        .title {
          font-size: 42px;
          font-weight: 800;
          margin: 0 0 12px 0;
          background: linear-gradient(90deg, #FFFFFF 0%, #E2E8F0 40%, #00D09C 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          letter-spacing: -0.5px;
        }

        .subtitle {
          font-size: 18px;
          color: #94A3B8;
          max-width: 800px;
          line-height: 1.5;
          margin: 0 0 32px 0;
        }

        .metrics-row {
          display: flex;
          gap: 20px;
          margin-top: 10px;
        }

        .card {
          flex: 1;
          background: rgba(15, 23, 42, 0.75);
          border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 12px;
          padding: 18px 20px;
          backdrop-filter: blur(10px);
          position: relative;
          overflow: hidden;
          transition: border-color 0.3s ease;
        }

        .card::before {
          content: '';
          position: absolute;
          top: 0; left: 0; right: 0; height: 3px;
        }

        .card-green::before { background: linear-gradient(90deg, #00D09C, #00F0FF); }
        .card-purple::before { background: linear-gradient(90deg, #8A2BE2, #EC4899); }
        .card-blue::before { background: linear-gradient(90deg, #3B82F6, #00D09C); }
        .card-gold::before { background: linear-gradient(90deg, #F59E0B, #EF4444); }

        .card-val {
          font-size: 26px;
          font-weight: 700;
          color: #F8FAFC;
          margin-bottom: 4px;
          display: flex;
          align-items: baseline;
          gap: 6px;
        }

        .card-val span {
          font-size: 13px;
          font-weight: 500;
          color: #00D09C;
        }

        .card-label {
          font-size: 12px;
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 0.8px;
          color: #64748B;
        }

        /* Animated Flow Beam */
        .flow-visualizer {
          position: absolute;
          right: 40px;
          top: 40px;
          width: 320px;
          height: 180px;
          background: rgba(10, 15, 30, 0.85);
          border: 1px solid rgba(0, 208, 156, 0.3);
          border-radius: 12px;
          padding: 16px;
          font-family: monospace;
          font-size: 11px;
          box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .flow-line {
          color: #64748B;
          margin-bottom: 8px;
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .flow-tag {
          padding: 2px 6px;
          border-radius: 4px;
          font-size: 10px;
          font-weight: 600;
        }

        .tag-ctx { background: rgba(59, 130, 246, 0.2); color: #60A5FA; }
        .tag-core { background: rgba(138, 43, 226, 0.2); color: #C084FC; }
        .tag-out { background: rgba(0, 208, 156, 0.2); color: #34D399; }

        .blinking-cursor {
          display: inline-block;
          width: 6px;
          height: 12px;
          background-color: #00D09C;
          animation: blink 1s infinite;
          vertical-align: middle;
        }

        @keyframes blink {
          0%, 50% { opacity: 1; }
          51%, 100% { opacity: 0; }
        }
      </style>

      <div class="container">
        <div class="grid-bg"></div>

        <div class="header-badge">
          <div class="pulse-dot"></div>
          MAGICPIN AI CHALLENGE • OFFICIAL BENCHMARK
        </div>

        <div class="flow-visualizer">
          <div style="color: #00D09C; font-weight: bold; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px;">
            ⚡ LIVE INFERENCE TELEMETRY
          </div>
          <div class="flow-line">
            <span class="flow-tag tag-ctx">CONTEXT</span>
            <span style="color: #94A3B8;">4-Layers Injected</span>
            <span style="margin-left: auto; color: #00D09C;">OK [200]</span>
          </div>
          <div class="flow-line">
            <span class="flow-tag tag-core">ENGINE</span>
            <span style="color: #94A3B8;">Guardrails Verified</span>
            <span style="margin-left: auto; color: #00D09C;">PASS</span>
          </div>
          <div class="flow-line">
            <span class="flow-tag tag-core">STATE</span>
            <span style="color: #94A3B8;">Auto-Reply Checked</span>
            <span style="margin-left: auto; color: #C084FC;">14400s Backoff</span>
          </div>
          <div class="flow-line">
            <span class="flow-tag tag-out">OUTPUT</span>
            <span style="color: #F8FAFC;">Sub-10ms Latency</span>
            <span class="blinking-cursor"></span>
          </div>
        </div>

        <h1 class="title">VERA ELITE AI ENGINE</h1>
        <p class="subtitle">
          Next-Generation Autonomous WhatsApp Merchant AI for Magicpin. Multi-turn stateful reasoning, zero-hallucination factual anchoring, domain guardrails &amp; instant intent handoffs.
        </p>

        <div class="metrics-row">
          <div class="card card-green">
            <div class="card-val">50 / 50 <span>100%</span></div>
            <div class="card-label">Judge Benchmark Score</div>
          </div>
          <div class="card card-purple">
            <div class="card-val">&lt; 10 ms <span>Sync</span></div>
            <div class="card-label">Deterministic Latency</div>
          </div>
          <div class="card card-blue">
            <div class="card-val">0.0 % <span>Zero</span></div>
            <div class="card-label">Hallucination Rate</div>
          </div>
          <div class="card card-gold">
            <div class="card-val">100 % <span>Resolved</span></div>
            <div class="card-label">Auto-Reply Protection</div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
